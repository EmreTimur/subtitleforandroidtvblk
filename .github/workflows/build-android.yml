name: Build Android APK

on:
  push:
    paths:
      - 'android/**'
      - 'lib/**'
      - 'cmake/**'
      - 'third-party/**'
      - 'CMakeLists.txt'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tools
        run: |
          # nanopb generator needs protobuf
          pip install protobuf grpcio-tools
          sudo apt-get update
          sudo apt-get install -y ninja-build
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358" "cmake;3.22.1" "platforms;android-35"

      - name: Build debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug testDebugUnitTest

      - uses: actions/upload-artifact@v4
        with:
          name: chiaki-subtitles-apk
          path: android/app/build/outputs/apk/debug/*.apk
